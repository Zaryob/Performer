name: Tests

# Branches only: main is reached through a pull request whose branch has
# already been tested, so running the suite again after the merge adds
# nothing but queue time.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    name: Ubuntu ${{ matrix.ubuntu }}
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bpftrace g++ make python3
      - name: Test collector
        run: sudo make check
      - name: Try live PMU counters
        run: sudo python3 tests/pmu_live_smoke.py --optional

  viewer:
    name: Offline viewer
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci --no-audit --no-fund
      - name: Typecheck, test, and build viewer
        working-directory: viewer
        run: npm run typecheck && npm test && npm run build
      - name: Confirm committed offline viewer is current
        run: git diff --exit-code -- viewer/dist/index.html
